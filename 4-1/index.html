<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달성 수학 10분 심화</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1d2433;
    --muted: #5d6779;
    --line: #d9dee7;
    --accent: #2f6fde;
    --accent-soft: #e6eefc;
    --ok: #17924a;
    --ok-soft: #e5f6ec;
    --bad: #d6402f;
    --bad-soft: #fdecea;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 19px; line-height: 1.6; word-break: keep-all;
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 64px; }
  header.top { padding: 8px 0 16px; }
  .eyebrow { font-size: 15px; color: var(--muted); font-weight: 600; }
  h1 { font-size: 26px; margin: 2px 0 0; line-height: 1.3; }
  h1 .no { color: var(--accent); margin-right: 8px; }
  .pages { font-size: 15px; color: var(--muted); }
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    padding: 18px; margin-bottom: 18px;
  }
  .shared { background: #fffdf3; border-color: #ecdfaa; }
  .qhead { display: flex; align-items: flex-start; gap: 12px; }
  .qno {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 700;
    display: grid; place-items: center; font-size: 19px; margin-top: 1px;
  }
  .qtext { white-space: pre-line; flex: 1; min-width: 0; }
  figure { margin: 14px 0 4px; text-align: center; }
  figure img {
    max-width: 100%; max-height: 420px; background: #fff; border-radius: 8px;
    cursor: zoom-in; border: 1px solid var(--line);
  }
  figure figcaption { font-size: 13px; color: var(--muted); }
  table.data { border-collapse: collapse; margin: 12px auto 4px; background: #fff; font-size: 17px; }
  table.data caption { font-weight: 700; padding-bottom: 6px; }
  table.data th, table.data td { border: 1px solid #9aa3b2; padding: 6px 12px; text-align: center; }
  table.data th { background: #eef1f6; font-weight: 600; }
  .tablewrap { overflow-x: auto; }

  .answers { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lbl { font-weight: 600; }
  .arrow { color: var(--muted); font-weight: 700; }
  input.ans, textarea.ans {
    font: inherit; font-size: 20px; padding: 8px 12px; border: 2px solid #b8c0cd;
    border-radius: 10px; background: #fff; color: var(--ink); min-width: 0;
  }
  input.ans { width: 130px; }
  input.ans.wide { width: 260px; max-width: 100%; }
  input.ans.word { width: 120px; }
  textarea.ans { width: 100%; min-height: 96px; resize: vertical; }
  input.ans:focus, textarea.ans:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .part.wrong input.ans, .part.wrong textarea.ans, .part.wrong .choices { border-color: var(--bad); background: var(--bad-soft); }
  .part.right input.ans, .part.right textarea.ans { border-color: var(--ok); }
  .unit { font-weight: 600; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; border: 2px solid transparent; border-radius: 12px; padding: 2px; }
  .choices.stack { flex-direction: column; width: 100%; }
  .opt {
    font: inherit; font-size: 18px; text-align: left; padding: 8px 14px; border-radius: 10px;
    border: 2px solid #b8c0cd; background: #fff; color: var(--ink); cursor: pointer;
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .hint { font-size: 14px; color: var(--muted); width: 100%; }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  button.check {
    font: inherit; font-weight: 700; font-size: 19px; padding: 10px 26px; border-radius: 12px;
    border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  button.check:active { transform: translateY(1px); }
  .result { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .result .mark { font-size: 40px; line-height: 1; }
  .result.ok { color: var(--ok); }
  .result.bad { color: var(--bad); }
  .card.is-ok { border-color: var(--ok); background: linear-gradient(var(--ok-soft), var(--ok-soft)) top/100% 6px no-repeat, var(--card); }

  .score { text-align: center; font-weight: 700; color: var(--muted); margin-top: 8px; }

  /* 목록 */
  .unitname { font-size: 18px; font-weight: 700; margin: 22px 0 8px; }
  .list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .list a {
    display: block; text-decoration: none; color: var(--ink); background: var(--card);
    border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  .list a b { color: var(--accent); margin-right: 6px; }
  .list a span { display: block; font-size: 14px; color: var(--muted); }
  .back { font-size: 15px; color: var(--accent); text-decoration: none; }

  /* 그림 크게 보기 */
  #zoom {
    position: fixed; inset: 0; background: rgba(15, 20, 30, .88); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10; cursor: zoom-out;
  }
  #zoom.open { display: flex; }
  #zoom img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 8px; }
  #zoom .close { position: absolute; top: 10px; right: 16px; color: #fff; font-size: 34px; }

  @media (max-width: 520px) {
    body { font-size: 17px; }
    h1 { font-size: 22px; }
    .card { padding: 14px; }
    input.ans { width: 110px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="zoom" role="dialog" aria-label="그림 크게 보기"><span class="close" aria-hidden="true">×</span><img alt=""></div>

<script>
/* ============================================================
   문항 데이터 — 달성 수학 10분 4-1 (2, 5단원) 심화 문항
   파트 종류
     num   : 수 하나        {kind:'num', ans:150, unit:'°'}
     word  : 낱말           {kind:'word', ans:['과학관']}
     choice: 보기 고르기    {kind:'choice', options:[...], ans:[번호...], multi:true}
     essay : 서술형 키워드  {kind:'essay', groups:[['180'],['크','넘']]}
     nums  : 수 여러 개     {kind:'nums', ans:[105,120], unit:'°'}
   ============================================================ */
const UNITS = { 2: 'Ⅱ. 각도', 5: 'Ⅴ. 막대그래프' };

const LESSONS = {
  '07': { unit: 2, title: '각의 크기 재기', pages: '18~19쪽', qs: [
    { text: '시계의 긴바늘과 짧은바늘이 3시 정각에 이루는 각은 직각입니다. 시계의 숫자 사이의 간격이 모두 같을 때, 5시 정각에 두 바늘이 이루는 작은 쪽의 각은 몇 도인지 구하시오.',
      img: '07-1.png', parts: [{ kind: 'num', ans: 150, unit: '°' }] },
    { text: '명훈이는 각의 꼭짓점을 각도기의 중심에 맞추었지만, 각의 한 변을 밑금에 맞추지 않고 그림과 같이 놓았습니다. 이 각의 크기는 몇 도인지 구하시오.',
      img: '07-2.png', parts: [{ kind: 'num', ans: 75, unit: '°' }] },
  ]},
  '08': { unit: 2, title: '예각, 둔각, 각 어림하기', pages: '20~21쪽', qs: [
    { text: '그림에서 선 ㄱㄴ은 직선입니다. 그림에서 찾을 수 있는 크고 작은 각 중에서 예각과 둔각은 각각 몇 개인지 구하시오. (직선 ㄱㄴ이 이루는 각은 세지 않습니다.)',
      img: '08-1.png', parts: [
        { kind: 'num', label: '예각', ans: 3, unit: '개' },
        { kind: 'num', label: '둔각', ans: 2, unit: '개' } ] },
    { text: '다음 중 항상 옳은 것을 모두 찾아 기호를 쓰시오.',
      parts: [{ kind: 'choice', multi: true, stack: true, options: [
        '㉠ 예각 2개의 크기를 더하면 항상 둔각이 됩니다.',
        '㉡ 둔각 2개의 크기를 더하면 항상 180°보다 큽니다.',
        '㉢ 둔각에서 예각을 빼면 항상 예각이 됩니다.',
        '㉣ 직각과 예각의 크기를 더하면 항상 둔각이 됩니다.' ], ans: [1, 3] }] },
  ]},
  '09': { unit: 2, title: '각도의 합과 차', pages: '22~23쪽', qs: [

      parts: [{ kind: 'nums', ans: [105, 120, 135, 150], unit: '°' }] },
    { text: '그림에서 아래쪽 선은 직선이고, ㉠은 ㉡보다 40° 더 큽니다. ㉠과 ㉡의 각도를 각각 구하시오.',
      img: '09-2.png', parts: [
        { kind: 'num', label: '㉠', ans: 85, unit: '°' },
        { kind: 'num', label: '㉡', ans: 45, unit: '°' } ] },
  ]},
  '10': { unit: 2, title: '삼각형의 세 각의 크기의 합', pages: '24~25쪽', qs: [
    { text: '삼각형 ㄱㄴㄷ에서 점 ㄹ은 변 ㄴㄷ 위에 있습니다. ㉠의 각도를 구하시오.',
      img: '10-1.png', parts: [{ kind: 'num', ans: 55, unit: '°' }] },
    { text: '삼각형의 두 각의 크기를 나타낸 것입니다. 삼각형이 될 수 없는 것을 찾아 기호를 쓰고, 그 까닭을 쓰시오.\n㉠ 95°, 40°　　㉡ 100°, 85°　　㉢ 30°, 60°',
      parts: [
        { kind: 'choice', label: '기호', options: ['㉠', '㉡', '㉢'], ans: [1] },
        { kind: 'essay', label: '까닭', groups: [['180'], ['크', '넘', '185', '많', '초과']] } ] },
  ]},
  '11': { unit: 2, title: '사각형의 네 각의 크기의 합', pages: '26~27쪽', qs: [
    { text: '사각형의 네 각 중에서 두 각은 직각입니다. 나머지 두 각의 크기의 차가 40°일 때, 나머지 두 각 중 큰 각은 몇 도인지 구하시오.',
      parts: [{ kind: 'num', ans: 110, unit: '°' }] },
    { text: '그림에서 아래쪽 선은 직선입니다. ㉠의 각도를 구하시오.',
      img: '11-2.png', parts: [{ kind: 'num', ans: 75, unit: '°' }] },
  ]},
  '12': { unit: 2, title: '얼마나 알고 있나요?', pages: '28~29쪽', qs: [
    { text: '서연이가 사각형의 네 각의 크기를 각도기로 재었더니 85°, 100°, 95°, 90°였습니다. 서연이가 각도를 바르게 재었는지 쓰고, 그 까닭을 쓰시오.',
      parts: [
        { kind: 'choice', label: '답', options: ['바르게 재었습니다.', '바르게 재지 않았습니다.'], ans: [1] },
        { kind: 'essay', label: '까닭', groups: [['360'], ['370', '크', '넘', '많', '다르', '아니', '않']] } ] },
    { text: '두 삼각자를 직선 위에 꼭짓점이 한 점에서 만나도록 놓았습니다. ㉠의 각도를 구하시오.',
      img: '12-2.png', parts: [{ kind: 'num', ans: 75, unit: '°' }] },
  ]},

  '25': { unit: 5, title: '막대그래프 알기(1)', pages: '60~61쪽',
    shared: { text: '키릴이네 반 학생들이 좋아하는 과일을 조사하여 나타낸 그래프입니다. 물음에 답하시오. (1~2)', img: '25.png' },
    qs: [
    { text: '가장 많은 학생이 좋아하는 과일부터 차례로 쓰고, 가장 많은 학생이 좋아하는 과일과 가장 적은 학생이 좋아하는 과일의 학생 수의 차를 구하시오.',
      parts: [
        { kind: 'word', ans: ['딸기'] },
        { kind: 'word', join: true, ans: ['사과'] },
        { kind: 'word', join: true, ans: ['귤'] },
        { kind: 'word', join: true, ans: ['포도'] },
        { kind: 'num', label: '학생 수의 차', ans: 5, unit: '명' } ] },
    { text: '포도를 좋아하던 학생 중 몇 명이 사과로 마음을 바꾸었더니, 사과를 좋아하는 학생 수와 딸기를 좋아하는 학생 수가 같아졌습니다. 이때 포도를 좋아하는 학생은 몇 명이 되었는지 구하시오.',
      parts: [{ kind: 'num', ans: 3, unit: '명' }] },
  ]},
  '26': { unit: 5, title: '막대그래프 알기(2)', pages: '62~63쪽',
    shared: { text: '요일별 도서관을 이용한 학생 수를 조사하여 나타낸 막대그래프입니다. 물음에 답하시오. (1~2)', img: '26.png' },
    qs: [
    { text: '도서관을 이용한 학생 수가 금요일보다 많은 요일을 모두 쓰고, 그 요일들에 도서관을 이용한 학생은 모두 몇 명인지 구하시오.',
      parts: [
        { kind: 'choice', label: '요일', multi: true, options: ['월요일', '화요일', '수요일', '목요일', '금요일'], ans: [0, 2] },

    { text: '위 막대그래프를 가로 눈금 한 칸이 1명인 막대그래프로 다시 그리려고 합니다. 수요일 막대와 화요일 막대의 길이는 몇 칸 차이가 나는지 구하시오.',
      parts: [{ kind: 'num', ans: 10, unit: '칸' }] },
  ]},
  '27': { unit: 5, title: '막대그래프 그리기', pages: '64~65쪽',
    shared: { text: '모둠별로 모은 빈 병의 수를 조사하여 나타낸 표입니다. 물음에 답하시오. (1~2)',
      table: { caption: '<모둠별 모은 빈 병의 수>', rows: [
        ['모둠', '1모둠', '2모둠', '3모둠', '4모둠', '합계'],
        ['병의 수(개)', '12', '7', '15', '9', '43'] ] } },
    qs: [
    { text: '위의 표를 세로 눈금 한 칸이 2개인 막대그래프로 나타낼 때, 막대의 끝이 눈금선에 꼭 맞지 않고 칸의 중간에서 끝나는 모둠을 모두 쓰시오.',
      parts: [{ kind: 'choice', multi: true, options: ['1모둠', '2모둠', '3모둠', '4모둠'], ans: [1, 2, 3] }] },
    { text: '소은이가 위의 표를 보고 그린 막대그래프입니다. 잘못 그린 곳을 두 가지 찾아 바르게 고치시오.',
      img: '27-2.png',
      parts: [{ kind: 'essay', placeholder: '① 잘못된 곳 → 바르게 고치기\n② 잘못된 곳 → 바르게 고치기', groups: [['제목'], ['4모둠'], ['9']] }] },
  ]},
  '28': { unit: 5, title: '자료를 조사하여 막대그래프 그리기', pages: '66~67쪽', qs: [
    { text: '진호네 반 학생 25명이 가장 좋아하는 계절을 조사하였습니다. 봄은 7명, 가을은 6명이고, 여름을 좋아하는 학생 수는 겨울을 좋아하는 학생 수의 2배입니다. 여름과 겨울을 좋아하는 학생은 각각 몇 명인지 구하시오.',

        { kind: 'num', label: '여름', ans: 8, unit: '명' },
        { kind: 'num', label: '겨울', ans: 4, unit: '명' } ] },
    { text: '1반과 2반 학생들이 기르고 싶어 하는 반려동물을 조사한 표입니다. 두 반의 학생 수를 합하여 세로 눈금 한 칸이 2명인 막대그래프로 나타내려면 세로 눈금은 적어도 몇 칸 필요한지 구하시오.',

      parts: [{ kind: 'num', ans: 40, unit: '명' }] },

      parts: [{ kind: 'word', ans: ['과학관'], wide: true }] },
  ]},
  '30': { unit: 5, title: '얼마나 알고 있나요?', pages: '70~71쪽',
    shared: { text: '나윤이네 학년 학생들이 좋아하는 간식을 조사하여 나타낸 막대그래프입니다. 물음에 답하시오. (1~2)', img: '30.png' },
    qs: [
    { text: '아이스크림을 좋아하는 학생 수는 과자를 좋아하는 학생 수의 몇 배인지 구하시오.',
      parts: [{ kind: 'num', ans: 2, unit: '배' }] },
    { text: '떡볶이를 좋아하던 학생 중 몇 명이 빵으로 마음을 바꾸었더니 떡볶이와 빵을 좋아하는 학생 수가 같아졌습니다. 마음을 바꾼 학생은 몇 명인지 구하시오.',
      parts: [{ kind: 'num', ans: 4, unit: '명' }] },
  ]},
};

/* ================= 채점 ================= */
const noSpace = s => String(s).replace(/\s+/g, '');
const UNIT_WORDS = ['°', '도', '개', '명', '칸', '배', '권', 'cm', 'm'];

function parseNum(raw, unit) {
  let s = String(raw).trim();
  // 대분수 "2 1/4" 는 띄어쓰기를 지우기 전에 처리
  const mixed = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)\s*$/);
  if (mixed) return +mixed[1] + (+mixed[2]) / (+mixed[3]);
  s = noSpace(s).replace(/,/g, '');
  const units = unit ? [unit, ...UNIT_WORDS] : UNIT_WORDS;
  for (const u of units) if (u && s.endsWith(u)) { s = s.slice(0, -u.length); break; }
  s = s.replace(/°$/, '');
  let m;
  if ((m = s.match(/^-?\d+(\.\d+)?$/))) return parseFloat(s);
  if ((m = s.match(/^(\d+)\/(\d+)$/)) && +m[2] !== 0) return +m[1] / +m[2];
  return NaN;
}
const sameNum = (a, b) => Math.abs(a - b) < 1e-9;

function normWord(s) {
  return noSpace(s)
    .replace(/[.,·!?~'"()\[\]<>「」『』:;\-]/g, '')
    .replace(/(입니다|이에요|예요|이요|요)$/, '');
}

function gradePart(p, v) {
  switch (p.kind) {
    case 'num':   return sameNum(parseNum(v || '', p.unit), p.ans);
    case 'word':  return p.ans.some(a => normWord(a) === normWord(v || ''));
    case 'choice': {
      const sel = (v || []).slice().sort((a, b) => a - b);
      const ans = p.ans.slice().sort((a, b) => a - b);
      return sel.length === ans.length && sel.every((x, i) => x === ans[i]);
    }
    case 'essay': {
      const t = noSpace(v || '');
      return p.groups.every(g => g.some(k => t.includes(noSpace(k))));
    }
    case 'nums': {
      // 쉼표·띄어쓰기·'와/과/,' 로 나눈 수들이 정답과 똑같아야 정답 (순서 상관없음)
      const toks = String(v || '').split(/[,，、\s/]+|와|과|그리고/).map(t => t.trim()).filter(Boolean);
      const vals = toks.map(t => parseNum(t, p.unit));
      if (!vals.length || vals.some(isNaN)) return false;
      const uniq = [...new Set(vals)].sort((a, b) => a - b);
      const ans = p.ans.slice().sort((a, b) => a - b);
      return uniq.length === ans.length && uniq.every((x, i) => sameNum(x, ans[i]));
    }
  }
  return false;
}

/* ================= 저장 (이 기기에만) ================= */
const STORE = 'dalseong10-4-1-v1';
function loadState() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function saveState(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }
let state = loadState();

/* ================= 화면 ================= */
const app = document.getElementById('app');
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

function figure(src, alt) {
  const img = el('img', { src: 'img/' + src, alt: alt || '문제 그림', loading: 'lazy' });
  img.addEventListener('click', () => openZoom(img.src));
  return el('figure', {}, img, el('figcaption', {}, '그림을 누르면 크게 볼 수 있어요'));
}
function dataTable(t) {
  const tbl = el('table', { class: 'data' });
  if (t.caption) tbl.append(el('caption', {}, t.caption));
  t.rows.forEach((r, i) => tbl.append(el('tr', {}, r.map((c, j) => el(i === 0 || j === 0 ? 'th' : 'td', {}, c)))));
  return el('div', { class: 'tablewrap' }, tbl);
}

function renderIndex() {
  document.title = '달성 수학 10분 4-1 심화';
  app.replaceChildren(
    el('header', { class: 'top' },
      el('div', { class: 'eyebrow' }, '대구광역시달성교육지원청'),
      el('h1', {}, '달성 수학 10분 4-1 · 심화 문항')),
    ...Object.entries(UNITS).map(([u, name]) => [
      el('div', { class: 'unitname' }, name),
      el('div', { class: 'list' }, Object.entries(LESSONS).filter(([, L]) => L.unit == u).map(([no, L]) =>
        el('a', { href: '#' + no }, el('b', {}, no + '차시'), L.title, el('span', {}, L.pages))))
    ]),
    el('p', { style: 'text-align:center;margin-top:28px' }, el('a', { class: 'back', href: '../' }, '← 학년 선택'))
  );
}

function renderLesson(no) {
  const L = LESSONS[no];
  document.title = `${no}차시 ${L.title} · 달성 수학 10분`;
  const st = state[no] = state[no] || {};
  const blocks = [
    el('header', { class: 'top' },
      el('div', { class: 'eyebrow' }, '달성 수학 10분 4-1 · ' + UNITS[L.unit]),
      el('h1', {}, el('span', { class: 'no' }, no), L.title),
      el('div', { class: 'pages' }, L.pages + ' 심화 문항 · 연습장에 풀고 답만 쓰세요')),
  ];
  if (L.shared) {
    blocks.push(el('section', { class: 'card shared' },
      el('div', { class: 'qtext' }, '※ ' + L.shared.text),
      L.shared.img ? figure(L.shared.img) : null,
      L.shared.table ? dataTable(L.shared.table) : null));
  }
  const scoreEl = el('div', { class: 'score' });
  const updateScore = () => {
    const n = L.qs.filter((q, i) => (st[i] || {}).ok).length;
    scoreEl.textContent = n ? `${L.qs.length}문제 중 ${n}문제 맞혔어요` + (n === L.qs.length ? ' 🎉' : '') : '';
  };

  L.qs.forEach((q, qi) => {
    const qs = st[qi] = st[qi] || { v: [] };
    const card = el('section', { class: 'card' + (qs.ok ? ' is-ok' : '') });
    const getters = [];
    const partEls = [];
    const answers = el('div', { class: 'answers' });
    let row = null;

    q.parts.forEach((p, pi) => {
      const saved = qs.v[pi];
      const part = el('span', { class: 'part' });
      if (p.kind === 'num' || p.kind === 'word' || p.kind === 'nums') {
        const inp = el('input', {
          class: 'ans' + (p.kind === 'nums' || p.wide ? ' wide' : '') + (p.kind === 'word' ? ' word' : ''),
          type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
          inputmode: p.kind === 'num' ? 'decimal' : 'text',
          placeholder: p.kind === 'nums' ? '예: 10, 20, 30' : '',
          'aria-label': (p.label || '답') + ' 입력',
        });
        inp.value = saved || '';
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) check(); });
        part.append(inp);
        if (p.unit) part.append(el('span', { class: 'unit' }, p.unit));
        getters.push(() => inp.value);
      } else if (p.kind === 'choice') {
        let sel = Array.isArray(saved) ? saved.slice() : [];
        const box = el('div', { class: 'choices' + (p.stack ? ' stack' : ''), role: 'group' });
        const btns = p.options.map((o, oi) => {
          const b = el('button', { type: 'button', class: 'opt', 'aria-pressed': String(sel.includes(oi)) }, o);
          b.addEventListener('click', () => {
            if (p.multi) sel = sel.includes(oi) ? sel.filter(x => x !== oi) : [...sel, oi];
            else sel = sel.includes(oi) ? [] : [oi];
            btns.forEach((bb, k) => bb.setAttribute('aria-pressed', String(sel.includes(k))));
          });
          return b;
        });
        box.append(...btns);
        if (p.multi) box.append(el('div', { class: 'hint' }, '알맞은 것을 모두 누르세요'));
        part.append(box);
        part.style.width = p.stack ? '100%' : '';
        getters.push(() => sel.slice());
      } else if (p.kind === 'essay') {
        const ta = el('textarea', { class: 'ans', placeholder: p.placeholder || '까닭을 쓰세요', 'aria-label': (p.label || '답') + ' 입력' });
        ta.value = saved || '';
        part.append(ta);
        part.style.width = '100%';
        getters.push(() => ta.value);
      }
      partEls.push(part);

      if (p.join && row) {
        row.append(el('span', { class: 'arrow' }, '→'), part);
      } else {
        row = el('div', { class: 'row' });
        if (p.label) row.append(el('span', { class: 'lbl' }, p.label));
        row.append(part);
        answers.append(row);
      }
    });

    const result = el('div', { class: 'result', 'aria-live': 'polite' });
    const showResult = ok => {
      result.className = 'result ' + (ok ? 'ok' : 'bad');
      result.replaceChildren(el('span', { class: 'mark' }, ok ? '⭕' : '❌'), ok ? '정답이에요!' : '다시 생각해 보세요');
      card.classList.toggle('is-ok', ok);
    };
    function check() {
      const vals = getters.map(g => g());
      const each = q.parts.map((p, i) => gradePart(p, vals[i]));
      const ok = each.every(Boolean);
      if (q.parts.length > 1) partEls.forEach((pe, i) => { pe.classList.toggle('wrong', !each[i]); pe.classList.toggle('right', each[i]); });
      else partEls[0].classList.toggle('wrong', !ok);
      qs.v = vals; qs.ok = ok; qs.tried = true;
      saveState(state);
      showResult(ok);
      updateScore();
    }
    if (qs.tried) showResult(!!qs.ok);

    card.append(...[
      el('div', { class: 'qhead' }, el('div', { class: 'qno' }, String(qi + 1)), el('div', { class: 'qtext' }, q.text)),
      q.img ? figure(q.img) : null,
      q.table ? dataTable(q.table) : null,
      answers,
      el('div', { class: 'actions' }, el('button', { type: 'button', class: 'check', onclick: check }, '채점하기'), result),
    ].filter(Boolean));
    blocks.push(card);
  });

  blocks.push(scoreEl, el('p', { style: 'text-align:center' }, el('a', { class: 'back', href: '#' }, '← 4-1 차시 목록')));
  app.replaceChildren(...blocks);
  updateScore();
  window.scrollTo(0, 0);
}

function route() {
  const no = decodeURIComponent(location.hash.slice(1)).replace(/[^0-9]/g, '').padStart(2, '0');
  if (LESSONS[no]) renderLesson(no); else renderIndex();
}

/* 그림 크게 보기 */
const zoom = document.getElementById('zoom');
function openZoom(src) { zoom.querySelector('img').src = src; zoom.classList.add('open'); }
zoom.addEventListener('click', () => zoom.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') zoom.classList.remove('open'); });

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
